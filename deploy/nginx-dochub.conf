# DocHub nginx 反向代理配置
# 放置路径：/etc/nginx/conf.d/dochub.conf （或 sites-available 软链到 sites-enabled）
# 改完执行：sudo nginx -t && sudo systemctl reload nginx
# HTTPS 证书：sudo certbot --nginx -d your-domain.example.com

server {
    listen 80;
    server_name your-domain.example.com;   # 改成真实域名或服务器公网 IP

    # 上传体积上限与 Flask MAX_CONTENT_LENGTH(50MB) 对齐，留余量
    client_max_body_size 55m;

    # 静态资源由 nginx 直接下发，减轻 gunicorn 压力
    location /static/ {
        alias /opt/dochub/app/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 其余请求反代到本机 gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# certbot 签发证书后会自动追加 443 server 块并把 80 跳转到 443，
# 届时生产 Cookie 的 Secure 标记才会生效（APP_ENV=production 已要求 HTTPS）。
