{% extends "base.html" %}
{% block title %}登录 | DocHub{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
        <span class="logo-text">DocHub</span>
      </div>
      <h1 class="auth-title">欢迎回来</h1>
      <p class="auth-subtitle">登录后即可收藏文档、发表评论和贡献内容</p>
    </div>
    <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}" class="auth-form">
      {% if request.args.get('next') %}<input type="hidden" name="next" value="{{ request.args.get('next') }}">{% endif %}
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="form-group">
        <label class="form-label">用户名或邮箱</label>
        <input type="text" class="form-input" name="identifier" value="{{ identifier if identifier else '' }}" placeholder="请输入用户名或邮箱" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" class="form-input" name="password" placeholder="请输入密码" required>
      </div>
      <div class="form-group form-check">
        <label><input type="checkbox" name="remember"> 记住我</label>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">登录</button>
    </form>
    <div class="auth-footer">
      <p>还没有账号？<a href="{{ url_for('auth.register') }}">立即注册</a></p>
      <p class="auth-demo">演示账号：demo / demo123</p>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_css %}
<style>
.auth-page { min-height: calc(100vh - 64px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.auth-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 36px 32px; box-shadow: var(--shadow-md); }
.auth-header { text-align: center; margin-bottom: 28px; }
.auth-logo { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px; }
.auth-logo .logo-text { font-family: var(--font-serif); font-size: 22px; font-weight: 700; color: var(--text-primary); }
.auth-title { font-family: var(--font-serif); font-size: 24px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
.auth-subtitle { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
.auth-form { margin-bottom: 24px; }
.form-check { display: flex; align-items: center; }
.form-check label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); cursor: pointer; }
.auth-footer { text-align: center; }
.auth-footer p { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
.auth-footer a { color: var(--primary); text-decoration: none; font-weight: 500; }
.auth-demo { background: var(--primary-light); padding: 8px 12px; border-radius: 6px; font-size: 12px !important; color: var(--primary) !important; margin-top: 12px !important; }
</style>
{% endblock %}
