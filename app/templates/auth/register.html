{% extends "base.html" %}
{% block title %}注册 | DocHub{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
        <span class="logo-text">DocHub</span>
      </div>
      <h1 class="auth-title">创建账号</h1>
      <p class="auth-subtitle">加入 DocHub，发现更多官方文档</p>
    </div>
    <form method="post" action="{{ url_for('auth.register') }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="form-group">
        <label class="form-label">用户名</label>
        <input type="text" class="form-input" name="username" value="{{ username if username else '' }}" placeholder="至少2个字符" required>
      </div>
      <div class="form-group">
        <label class="form-label">邮箱</label>
        <input type="email" class="form-input" name="email" value="{{ email if email else '' }}" placeholder="请输入邮箱地址" required>
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" class="form-input" name="password" placeholder="至少6位" required>
      </div>
      <div class="form-group">
        <label class="form-label">确认密码</label>
        <input type="password" class="form-input" name="confirm_password" placeholder="再次输入密码" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">注册</button>
    </form>
    <div class="auth-footer">
      <p>已有账号？<a href="{{ url_for('auth.login') }}">立即登录</a></p>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_css %}
<style nonce="{{ csp_nonce }}">
.auth-page { min-height: calc(100vh - 64px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.auth-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 36px 32px; box-shadow: var(--shadow-md); }
.auth-header { text-align: center; margin-bottom: 28px; }
.auth-logo { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px; }
.auth-logo .logo-text { font-family: var(--font-serif); font-size: 22px; font-weight: 700; color: var(--text-primary); }
.auth-title { font-family: var(--font-serif); font-size: 24px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
.auth-subtitle { font-size: 14px; color: var(--text-secondary); }
.auth-form { margin-bottom: 24px; }
.auth-footer { text-align: center; }
.auth-footer p { font-size: 13px; color: var(--text-secondary); }
.auth-footer a { color: var(--primary); text-decoration: none; font-weight: 500; }
</style>
{% endblock %}
