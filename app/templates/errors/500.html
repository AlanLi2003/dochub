{% extends "base.html" %}
{% block title %}500 - 服务器错误 | DocHub{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-code">500</div>
  <h1 class="error-title">服务器内部错误</h1>
  <p class="error-desc">服务器遇到了一些问题，请稍后再试</p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary">返回首页</a>
</div>
{% endblock %}
{% block extra_css %}
<style>
.error-page { text-align: center; padding: 80px 20px; }
.error-code { font-family: var(--font-serif); font-size: 96px; font-weight: 900; color: var(--error); line-height: 1; margin-bottom: 16px; }
.error-title { font-family: var(--font-serif); font-size: 24px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
.error-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; }
</style>
{% endblock %}
