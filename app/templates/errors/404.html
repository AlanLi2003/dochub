{% extends "base.html" %}
{% block title %}404 - 页面未找到 | DocHub{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-code">404</div>
  <h1 class="error-title">页面未找到</h1>
  <p class="error-desc">您访问的页面不存在或已被移除</p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary">返回首页</a>
</div>
{% endblock %}
{% block extra_css %}
<style nonce="{{ csp_nonce }}">
.error-page { text-align: center; padding: 80px 20px; }
.error-code { font-family: var(--font-serif); font-size: 96px; font-weight: 900; color: var(--primary); line-height: 1; margin-bottom: 16px; }
.error-title { font-family: var(--font-serif); font-size: 24px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
.error-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; }
</style>
{% endblock %}
